apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-platform-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: ai-inference
    interval: 30s
    rules:
    - alert: HighRequestLatency
      expr: histogram_quantile(0.95, sum(rate(vllm:request_duration_seconds_bucket[5m])) by (le, model)) > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High p95 latency for {{ $labels.model }}"
        description: "p95 latency is {{ $value }}s for model {{ $labels.model }}"

    - alert: CriticalRequestLatency
      expr: histogram_quantile(0.99, sum(rate(vllm:request_duration_seconds_bucket[5m])) by (le, model)) > 30
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Critical p99 latency for {{ $labels.model }}"
        description: "p99 latency is {{ $value }}s for model {{ $labels.model }}"

    - alert: HighErrorRate
      expr: sum(rate(vllm:request_errors_total[5m])) / sum(rate(vllm:requests_total[5m])) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "High inference error rate"
        description: "Error rate is {{ $value | humanizePercentage }}"

    - alert: GPUNotUtilized
      expr: DCGM_FI_DEV_GPU_UTIL < 10
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "GPU underutilized on {{ $labels.Instance }}"
        description: "GPU {{ $labels.Instance }} at {{ $value }}% utilization for 30m"

    - alert: HighGPUUsage
      expr: DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL > 0.95
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "GPU memory critical on {{ $labels.Instance }}"
        description: "GPU memory at {{ $value | humanizePercentage }} on {{ $labels.Instance }}"

  - name: platform
    interval: 1m
    rules:
    - alert: NodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Node {{ $labels.node }} is Not Ready"
        description: "Node has been Not Ready for 5 minutes"

    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[15m]) > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} crash looping"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times"

    - alert: PersistentVolumeFilling
      expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PVC {{ $labels.persistentvolumeclaim }} is filling up"
        description: "PVC at {{ $value | humanizePercentage }} capacity"

    - alert: CertificateExpiring
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 604800
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Certificate {{ $labels.name }} expiring in <7 days"
        description: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value }}s"

    - alert: KueueQueueBacklog
      expr: kueue_pending_workloads > 10
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "Kueue queue {{ $labels.queue }} has backlog"
        description: "{{ $value }} pending workloads in {{ $labels.queue }}"

  - name: cost
    interval: 5m
    rules:
    - alert: CostSpike
      expr: sum(increase(opencost_total_cost[1h])) > (sum(increase(opencost_total_cost[1h] offset 24h)) * 1.5)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Cost spike detected"
        description: "Cost increased >50% compared to same hour yesterday"

    - alert: IdleGPUCost
      expr: (sum(opencost_gpu_cost) - sum(opencost_gpu_cost{label=~".*ai.*"})) / sum(opencost_gpu_cost) > 0.3
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Significant idle GPU cost"
        description: "{{ $value | humanizePercentage }} of GPU cost is non-AI/idle"
