name: Build and Scan Container
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "Dockerfile*"
      - ".dockerignore"

jobs:
  build:
    name: Build and Sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/ai-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/syft-action@v0.17
        with:
          image: ${{ secrets.REGISTRY_URL }}/ai-platform:${{ github.sha }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Attach SBOM
        run: |
          oras attach ${{ secrets.REGISTRY_URL }}/ai-platform:${{ github.sha }} \
            --artifact-type application/spdx+json \
            sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            --annotations "sha=${{ github.sha }}" \
            --annotations "ref=${{ github.ref }}" \
            ${{ secrets.REGISTRY_URL }}/ai-platform:${{ github.sha }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.REGISTRY_URL }}/ai-platform:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 1

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
