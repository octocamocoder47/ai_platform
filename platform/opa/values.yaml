---
# OPA Gatekeeper Helm values
replicas: 3

audit:
  replicas: 2
  logLevel: info
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

webhook:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

controllerManager:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Default namespace exclusion
namespaceExclusionPrefixes:
  - kube-system
  - kube-public
  - gatekeeper-system
  - kyverno
  - cilium
  - cert-manager
  - argocd

# Enable mutation
enableMutation: true

postInstall:
  labelNamespace:
    enabled: true

# Constraint templates and constraints deployed separately via ArgoCD
