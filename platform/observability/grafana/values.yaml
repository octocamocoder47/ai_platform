grafana:
  enabled: true

  admin:
    existingSecret: grafana-admin

  ingress:
    enabled: false

  service:
    type: ClusterIP

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: "200m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus.monitoring.svc:9090
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
        - name: Tempo
          type: tempo
          url: http://tempo.monitoring.svc:3200
          access: proxy
        - name: OpenCost
          type: prometheus
          url: http://opencost.opencost.svc:9003
          access: proxy

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: ai-platform
          orgId: 1
          folder: AI Platform
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/ai-platform

  dashboardsConfigMaps:
    - configMapName: grafana-dashboards
      fileName: ai-platform
