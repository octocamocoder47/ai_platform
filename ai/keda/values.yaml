keda:
  version: "2.16.0"

  operator:
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  metricsServer:
    resources:
      requests:
        cpu: "200m"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  webhooks:
    resources:
      requests:
        cpu: "100m"
        memory: 128Mi
      limits:
        cpu: "500m"
        memory: 256Mi

  prometheus:
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
    operator:
      enabled: true
      serviceMonitor:
        enabled: true
    webhooks:
      enabled: true
      serviceMonitor:
        enabled: true

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Service accounts for Prometheus scraping
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: ""
