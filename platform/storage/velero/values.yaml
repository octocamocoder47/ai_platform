velero:
  version: "1.14.0"

  configuration:
    backupStorageLocation:
      - name: default
        provider: aws
        bucket: ai-platform-prod-backups
        config:
          region: us-east-1
    volumeSnapshotLocation:
      - name: default
        provider: aws
        config:
          region: us-east-1

  schedules:
    daily:
      schedule: "0 2 * * *"
      template:
        ttl: 720h
        includedNamespaces:
          - ai-inference
          - kserve
          - monitoring

  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.10.0
      volumeMounts:
        - mountPath: /target
          name: plugins

  resources:
    requests:
      cpu: "200m"
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
