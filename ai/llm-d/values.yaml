---
# llm-d distributed inference configuration
# llm-d is a CNCF Sandbox project for distributed LLM serving across multi-node
# This config enables multi-node inference for models that don't fit on a single GPU

global:
  operator:
    image: ghcr.io/llm-d/operator:latest
  controller:
    image: ghcr.io/llm-d/controller:latest
  worker:
    image: ghcr.io/llm-d/worker:latest
  backend: vllm

# Default model configuration
model:
  name: gemma-2b
  hfModelId: google/gemma-2b
  revision: main
  tensorParallelism: 1
  pipelineParallelism: 1
  dataParallelism: 1
  dtype: bfloat16
  maxModelLen: 4096
  trustRemoteCode: false

# Worker group definition
workerGroups:
  - name: gpu-workers
    replicas: 1
    minReplicas: 1
    maxReplicas: 4
    resources:
      requests:
        cpu: 2
        memory: 8Gi
        nvidia.com/gpu: 1
      limits:
        cpu: 8
        memory: 32Gi
        nvidia.com/gpu: 1
    nodeSelector:
      node-type: gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

# Scaling configuration
scaling:
  enabled: true
  cooldownPeriod: 300
  pollInterval: 15
  metrics:
    - type: prometheus
      query: rate(vllm:requests_total[1m]) / rate(vllm:max_requests[1m])
      threshold: 0.7

# Storage for model weights
storage:
  type: pvc
  size: 50Gi
  storageClassName: gp3

# Network configuration
network:
  rdmaEnabled: false
  hostNetwork: false

# Inference service configuration
service:
  type: ClusterIP
  port: 8000
  openaiCompatible: true

# Observability
observability:
  metrics:
    enabled: true
    port: 8080
  tracing:
    enabled: true
    endpoint: http://opentelemetry-collector:4317
  logging:
    level: info
    format: json
