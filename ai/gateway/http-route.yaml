apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ai-platform-gateway
spec:
  controllerName: "istio.io/gateway-controller"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-inference-gateway
  namespace: ai-inference
spec:
  gatewayClassName: ai-platform-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-inference
  namespace: ai-inference
spec:
  parentRefs:
    - name: ai-inference-gateway
  hostnames:
    - "llm-inference.ai-platform.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        - path:
            type: PathPrefix
            value: /v1/completions
        - path:
            type: PathPrefix
            value: /v1/embeddings
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: llm-inference-service
          port: 80
---
# InferenceExtension for KV-cache-aware routing (when llm-d enabled)
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: InferencePool
metadata:
  name: gemma-pool
  namespace: ai-inference
spec:
  targetPortNumber: 8080
  selector:
    app.kubernetes.io/name: vllm
---
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: InferenceModel
metadata:
  name: gemma-2-2b-it
  namespace: ai-inference
spec:
  modelName: google/gemma-2-2b-it
  poolRef:
    name: gemma-pool
